packages:
  - 'packages/*'

# pnpm 11 and later ignore pnpm settings in .npmrc, so they live here too.
# The org pins a hoisted layout in every pnpm repository. The planned Expo
# example app needs it: Metro runs with disableHierarchicalLookup, so it
# cannot find a nested dependency such as react-native's `invariant`.
nodeLinker: hoisted
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
engineStrict: true
