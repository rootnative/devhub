name: Release

# **This filename is part of the release credentials. Do not rename it.**
#
# npm binds a trusted publisher to an exact repository and an exact workflow
# filename. A rename revokes nothing and gives no warning. The next run
# passes every gate and then fails at the publish step with npm's 404
# (`404 PUT /@rootnative%2fdevhub`), which names no cause.
#
# Two workflows publish this package, and npmjs.com must have **both** as
# trusted publishers:
#
#   .github/workflows/release.yml         this file, the normal path
#   .github/workflows/release-manual.yml  a publish from a named ref
#
# This workflow publishes what is committed. It does not change the version,
# the CHANGELOG, or the READMEs. A person makes that commit, and a reviewer
# reads it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. It must be the version in packages/devhub/package.json."
        required: true
        type: string
      tag:
        description: "npm dist-tag."
        required: true
        default: latest
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc
      dry_run:
        description: "Run each gate and check the tarball, but publish nothing and push no tag."
        required: false
        default: false
        type: boolean

# `id-token: write` gives the OIDC token that npm exchanges for the publish.
# `contents: write` pushes the tag and makes the GitHub Release.
permissions:
  contents: write
  id-token: write

# No `cancel-in-progress`. A cancelled publish can leave a version on npm
# with no tag in git, and npm never accepts the same version again.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release @rootnative/devhub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-release.mjs reads the tags to see if the version exists.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          # Necessary also with trusted publishing: npm exchanges the OIDC
          # token at this registry.
          registry-url: https://registry.npmjs.org

      # An exact version, not a range. A new npm can change the release path
      # with no change in the repository. Change this pin in its own commit.
      - name: Install npm (staged publishing requires >=11.15.0)
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the release
        run: node scripts/check-release.mjs --version "${{ inputs.version }}" --dist-tag "${{ inputs.tag }}"

      # The same script that a laptop runs. No input skips it.
      - name: Preflight
        run: pnpm run preflight

      # The tag goes before the publish. A tag push can fail, and then
      # nothing is on npm. A publish cannot be undone, so it goes last.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: devhub@${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # OIDC only. Do not add `NODE_AUTH_TOKEN` or an `NPM_TOKEN` secret: a
      # token takes precedence over OIDC and hides a registration fault.
      # Both publishers on npmjs.com are stage-only, so npm refuses a plain
      # `npm publish`. `npm stage publish` uploads the tarball with
      # provenance and holds it. Nothing installs until a maintainer approves
      # it with 2FA. The dist-tag cannot change at the approval. `prepack`
      # builds the package and the page before the upload.
      - name: Stage the publish on npm
        if: ${{ !inputs.dry_run }}
        working-directory: packages/devhub
        run: npm stage publish --provenance --access public --tag "${{ inputs.tag }}"

      - name: Explain a publish failure
        if: ${{ failure() && !inputs.dry_run }}
        run: |
          echo "::error::A 404 on PUT /@rootnative%2fdevhub is almost always an authentication fault, not a missing package."
          echo "Check these, in this order:"
          echo "  1. Is '.github/workflows/release.yml' a trusted publisher of @rootnative/devhub on npmjs.com? npm binds to the exact filename. The release-manual.yml entry does not cover this file."
          echo "  2. Is this the first publish of the package? npm cannot register a trusted publisher before the package exists. Publish the first version from a laptop, and then register both workflows."
          echo "  3. Does the job still have 'id-token: write'?"
          echo "  4. Did the step run 'npm publish'? Both publishers are stage-only, so the step must run 'npm stage publish'."

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: devhub@${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "$VERSION" --generate-notes $prerelease

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            if [ "$DRY" = "true" ]; then
              echo "### Dry run: nothing was published"
              echo ""
              echo "Each gate passed. \`$VERSION\` was **not** staged, and no tag was pushed."
            else
              echo "### Staged \`$VERSION\`: not installable yet"
              echo ""
              echo "- npm: \`@rootnative/devhub@$VERSION\` is staged for the dist-tag \`$DIST_TAG\`. Approve it with 2FA on npmjs.com (Staged Packages), or with \`npm stage approve\`."
              echo "- Tag: \`devhub@$VERSION\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
