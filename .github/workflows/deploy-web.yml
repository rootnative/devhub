name: Deploy Web

# Publishes the docs site to GitHub Pages, at
# https://rootnative.github.io/devhub/. The Pages source of the repository
# must be "GitHub Actions".
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "packages/devhub/llms.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# deploy-pages needs `pages` and `id-token`. Nothing here writes to the
# repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push makes the older run worthless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # pnpm is installed in the step above, so the pnpm cache can read it.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # The site imports nothing from the package. It copies the committed
      # packages/devhub/llms.txt, and ci-build.yml checks that file against
      # the build on each change to the package.
      - name: Build the docs site
        run: pnpm run docs:build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
