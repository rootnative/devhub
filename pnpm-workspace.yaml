packages:
  - 'packages/*'
  - 'apps/*'
  - 'example'
  - 'docs'

# pnpm 11 and later ignore pnpm settings in .npmrc, so they live here too.
# The org pins a hoisted layout in every pnpm repository. The Expo apps need
# it: Metro runs with disableHierarchicalLookup, so it cannot find a nested
# dependency such as react-native's `invariant`.
nodeLinker: hoisted
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
engineStrict: true

# The install script of electron downloads the Electron binary. CI sets
# ELECTRON_SKIP_BINARY_DOWNLOAD, because no CI job starts the app.
onlyBuiltDependencies:
  - electron
